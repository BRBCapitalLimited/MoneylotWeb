name: Deploy to Elastic Beanstalk

on:
  push:
    branches:
      - main  

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out the repository code
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2. Package the application code into a ZIP file
    # Elastic Beanstalk requires a ZIP file. This excludes git and config files to keep it clean.
    - name: Generate Deployment Package
      run: zip -r deploy.zip . -x "*.git*" ".github/*"

    # 3. Configure AWS credentials using the secrets created in Step 2
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-west-1  

    # 4. Upload the ZIP to S3 and trigger Elastic Beanstalk to deploy it
    - name: Deploy to AWS Elastic Beanstalk
      uses: einaregilsson/beanstalk-deploy@v22
      with:
        aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        application_name: MoneyLotWeb 
        environment_name: MoneyLotWeb-env  
        version_label: "deploy-${{ github.sha }}"
        region: eu-west-1                   
        deployment_package: deploy.zip
